[package]
name = "anima-manager"
version = "0.1.0"
description = "Anima Manager para escritorio: la misma aplicación que la web, en su propia ventana."
authors = ["mrodher07"]
license = ""
repository = "https://github.com/mrodher07/anima-manager"
edition = "2021"
rust-version = "1.80"

[lib]
name = "anima_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"

[profile.release]
# Un ejecutable más pequeño: la aplicación no necesita más velocidad que la de su página.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
