      El icono. El .ico va primero por los navegadores que sólo miran ese; el PNG de 32 es
      el que acaban usando los modernos en la pestaña, y el de 180 el que coge iOS cuando

      partida.
    -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icono-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icono-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
